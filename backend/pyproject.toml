[project]
name = "family-law-assistant"
version = "0.1.0"
description = "Family Law Legal Assistant — lightweight backend (AI models served via HF Spaces)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.38.0",
    "python-multipart>=0.0.6",
    # LangChain & LangGraph
    "langchain>=0.1.4",
    "langsmith>=0.0.77",
    "langchain-community>=0.4.1",
    "langchain-core>=1.0.2",
    "langchain-huggingface>=1.0.0",
    "langchain-mistralai>=1.0.1",
    "langchain-ollama>=1.0,<1.1",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.2",
    # Vector Store
    "pymilvus>=2.5.0,<2.6.0",
    # Embeddings are generated through the Hugging Face Inference API.
    "requests>=2.31.0",
    "tiktoken>=0.12.0",
    "langdetect>=1.0.9",
    # HuggingFace Spaces client (calls Whisper, IndicConformer, IndicParler-TTS Spaces)
    "gradio_client>=1.3.0",
    # Data Processing
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "tqdm>=4.66.1",
    # API and HTTP
    "httpx>=0.26.0",
    "slowapi>=0.1.9",
    # Utilities
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    # Monitoring & Logging
    "loguru>=0.7.2",
    "psutil>=7.2.0",
    "rich>=14.2.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "asyncpg>=0.31.0",
    "psycopg[binary,pool]>=3.3.3",
    "langgraph-checkpoint-postgres>=3.0.4",
    # Auth
    "langchain-openai>=0.0.5",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "black>=24.1.1",
    "ruff>=0.1.14",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "sentry-sdk>=1.40.0",
]