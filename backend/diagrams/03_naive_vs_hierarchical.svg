<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" font-family="Menlo, Consolas, 'SF Mono', monospace" font-size="12.5">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/>
    </marker>
    <marker id="a3p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6E62"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="460" fill="#FFFFFF"/>
  <text x="20" y="30" font-family="Georgia, serif" font-size="17" font-weight="600" fill="#1B2430">The one hop that fixes grounding</text>

  <text x="20" y="70" font-family="Georgia, serif" font-weight="700" fill="#3E4A52" font-size="13">naive RAG</text>

  <!-- naive lane -->
  <rect x="20" y="90" width="240" height="76" rx="8" fill="#F5ECDA" stroke="#A6741F" stroke-width="1.4"/>
  <text x="140" y="123" text-anchor="middle" font-weight="700" fill="#A6741F">matched fragment</text>
  <text x="140" y="141" text-anchor="middle" fill="#4A4030">600 tok, isolated</text>

  <line x1="260" y1="128" x2="376" y2="128" stroke="#1B2430" stroke-opacity="0.65" marker-end="url(#a3)"/>
  <text x="270" y="118" fill="#6B7480" font-size="11">sent as-is</text>

  <rect x="380" y="90" width="180" height="76" rx="8" fill="none" stroke="#8A93A0"/>
  <text x="470" y="134" text-anchor="middle" font-weight="600" fill="#1B2430">LLM prompt</text>

  <line x1="560" y1="128" x2="676" y2="128" stroke="#1B2430" stroke-opacity="0.65" marker-end="url(#a3)"/>

  <rect x="680" y="90" width="340" height="76" rx="8" fill="none" stroke="#A8493F" stroke-width="1.6"/>
  <text x="850" y="123" text-anchor="middle" font-weight="700" fill="#A8493F">response</text>
  <text x="850" y="141" text-anchor="middle" fill="#3E4A52">gaps filled by guessing</text>

  <!-- divider -->
  <line x1="0" y1="235" x2="1400" y2="235" stroke="#D6DAE1"/>

  <text x="20" y="273" font-family="Georgia, serif" font-weight="700" fill="#3E4A52" font-size="13">hierarchical RAG (this system)</text>

  <!-- hierarchical lane -->
  <rect x="20" y="293" width="240" height="76" rx="8" fill="#F5ECDA" stroke="#A6741F" stroke-width="1.4"/>
  <text x="140" y="326" text-anchor="middle" font-weight="700" fill="#A6741F">matched fragment</text>
  <text x="140" y="344" text-anchor="middle" fill="#4A4030">same top-k match</text>

  <line x1="260" y1="331" x2="376" y2="331" stroke="#2F6E62" stroke-width="2.2" marker-end="url(#a3p)"/>
  <text x="264" y="317" fill="#2F6E62" font-weight="700" font-size="11.5">+ expand via parent_id</text>

  <rect x="380" y="293" width="240" height="76" rx="8" fill="#E4EFEC" stroke="#2F6E62" stroke-width="1.6"/>
  <text x="500" y="326" text-anchor="middle" font-weight="700" fill="#2F6E62">full parent record</text>
  <text x="500" y="344" text-anchor="middle" fill="#3E4A52">query + all responses</text>

  <line x1="620" y1="331" x2="716" y2="331" stroke="#1B2430" stroke-opacity="0.65" marker-end="url(#a3)"/>
  <text x="626" y="317" fill="#6B7480" font-size="11">complete context</text>

  <rect x="720" y="293" width="180" height="76" rx="8" fill="none" stroke="#8A93A0"/>
  <text x="810" y="337" text-anchor="middle" font-weight="600" fill="#1B2430">LLM prompt</text>

  <line x1="900" y1="331" x2="1016" y2="331" stroke="#1B2430" stroke-opacity="0.65" marker-end="url(#a3)"/>

  <rect x="1020" y="293" width="340" height="76" rx="8" fill="none" stroke="#3E7C5C" stroke-width="1.6"/>
  <text x="1190" y="326" text-anchor="middle" font-weight="700" fill="#3E7C5C">response</text>
  <text x="1190" y="344" text-anchor="middle" fill="#3E4A52">grounded in given text</text>
</svg>
